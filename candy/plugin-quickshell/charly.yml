plugin-quickshell:
    candy:
        description: |-
            OUT-OF-TREE charly plugin serving the `quickshell` live-deployment check verb — a
            standalone Go module driving the IPC channel of a Quickshell desktop shell over
            go-plugin gRPC via the charly plugin SDK. charly's loader fetches this candy's repo,
            go-builds the provider binary on the HOST, and serves it OUT-OF-PROCESS, so the
            `quickshell:` verb dispatches through the provider registry exactly like a built-in.
            .
            WHY IT IS A VERB AND NOT A `command:` STEP. Quickshell's `qs ipc` reports IPC-level
            failures — "Target not found.", "Function not found.", argument-count errors — on
            STDOUT while exiting ZERO. A `command:` step asserting "the menu opened" therefore
            passes against a shell with no menu plugin loaded, against a typo in the target
            name, and against an IPC surface that changed underneath it: green, asserting
            nothing. This verb reads those responses and fails on them, which is the entire
            difference between the two.
            .
            DESKTOP-AGNOSTIC BY CONSTRUCTION. It speaks Quickshell's IPC, not any one desktop's
            vocabulary: `config:` names the shell directory and `target:`/`function:` name
            whatever that shell's QML exposes. Omarchy is one caller; the failure strings the
            verb keys on live in the quickshell binary itself.
        plugin:
            source: github.com/opencharly/plugin-quickshell/candy/plugin-quickshell
            providers:
                - verb:quickshell
            # primary: is load-bearing, not sugar-for-taste. charly's pre-parse
            # collectPluginPrimaries reads it off the RAW yaml, so the scalar form
            # (`quickshell: ping`) only works when the candy manifest declares it. Without
            # it an authored shorthand step fails at PARSE time and takes the whole project
            # load down, not just that step.
            primary:
                quickshell: method
        plan:
            - check: the quickshell verb dispatches through the provider registry and reaches a live shell
              id: quickshell-verb-dispatches
              context:
                  - runtime
              # The verb's own smoke assertion. `ping` is the liveness convenience: it calls
              # the shell's conventional root target, so a PASS proves the plugin loaded, the
              # executor reverse channel is attached, `qs` is on the venue's PATH, and the
              # shell answered. Authored as the scalar shorthand, which is what the
              # `primary:` declaration above makes parseable.
              eventually: 60s
              quickshell:
                  method: ping
                  config: /usr/share/omarchy/shell

quickshell-skill:
    skill:
        name: quickshell
        family: check
        owner: plugin-quickshell
        description: |-
            MUST be invoked before any work involving: the `quickshell:` check verb — IPC against
            a Quickshell desktop shell (summoning and dismissing panels, menus, notification
            surfaces and overlays; asking a shell which plugins it loaded; liveness pings), or
            `quickshell:` declarative steps inside `check:` blocks. Served out-of-process by
            `candy/plugin-quickshell`. Desktop-agnostic: it speaks Quickshell's IPC, so it serves
            omarchy's shell and any other Quickshell desktop alike.
